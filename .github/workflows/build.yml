name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch upstream releases that break the build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update -q && sudo apt-get install -yq jq zip unzip xz-utils file
      - run: ./build.sh
      # Deliberately no artifact upload: the output is Salesforce-licensed software
      # and must not be redistributed.
